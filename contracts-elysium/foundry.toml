[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
# Elysium is an Arbitrum Orbit chain with Cancun (Uniswap v4 pools already run there on transient
# storage); the tests need it too for the v4 pool manager.
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./v3" }, { access = "read", path = "./v4" }, { access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 300
