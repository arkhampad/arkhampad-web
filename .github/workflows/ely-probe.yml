name: Elysium mainnet probe

# Started by hand. Reads public Elysium mainnet data: which RPC answers and which DEX / launchpad
# contracts the chain uses. Saves indexer/ely-mainnet.json and shows it on the run's summary page.
on:
  workflow_dispatch:
    inputs:
      rpc:
        description: "Elysium mainnet RPC (empty = try the known ones)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        run: node elyprobe.mjs ${{ inputs.rpc }}
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ely-mainnet.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Elysium mainnet probe"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
