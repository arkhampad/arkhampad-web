name: Deploy mainnet

# Runs only when started by hand. Always do a dry run first (broadcast off).
on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Network"
        required: true
        type: choice
        options:
          - base
          - robinhood
      broadcast:
        description: "Really send the transactions (leave off for a dry run first)"
        required: true
        type: boolean
        default: false
      start_mc:
        description: "Launch market cap in dollars"
        required: true
        default: "2000"
      verify_coin:
        description: "Optional: address of one launched coin to verify on the explorer (leave empty when deploying)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

env:
  ADMIN: "0xfae9d1aBac2a9fd4Ab68af9fF346eA871E819158"
  TREASURY: "0xd9D46EB26c9D753135683b7736FC2be097e7B099"
  RELAYER: "0x736662A7230092D1e728954508318b145e5B1B1C"
  VAULT_DAILY_CAP: "500"
  MIN_LAUNCH_BUY: "5"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Get libraries
        run: |
          mkdir -p lib
          git clone -q --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone -q --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone -q https://github.com/Uniswap/v4-periphery lib/v4-periphery
          cd lib/v4-periphery
          git -c advice.detachedHead=false checkout -q 9969eec44cfdf07e24b41de47f40276a58401976
          git submodule update -q --init --depth 1 lib/v4-core lib/permit2
          cd lib/v4-core && git submodule update -q --init --depth 1 lib/solmate

      - name: Pick network
        id: net
        run: |
          if [ "${{ inputs.chain }}" = "base" ]; then
            echo "rpc=${{ secrets.BASE_RPC }}" >> "$GITHUB_OUTPUT"
            echo "id=8453" >> "$GITHUB_OUTPUT"
          else
            echo "rpc=${{ secrets.ROBINHOOD_RPC }}" >> "$GITHUB_OUTPUT"
            echo "id=4663" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: forge build

      - name: Tests (must pass before anything is sent)
        if: ${{ inputs.verify_coin == '' }}
        run: forge test --no-match-path "test/*Fork.t.sol"

      - name: Deploy
        if: ${{ inputs.verify_coin == '' }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_KEY }}
          START_MC: ${{ inputs.start_mc }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          VERIFY=""
          if [ "${{ inputs.chain }}" = "base" ] && [ -n "$ETHERSCAN_API_KEY" ]; then VERIFY="--verify --etherscan-api-key $ETHERSCAN_API_KEY"; fi
          if [ "${{ inputs.broadcast }}" = "true" ]; then
            forge script script/Deploy.s.sol --rpc-url "${{ steps.net.outputs.rpc }}" --broadcast --slow $VERIFY
            forge script script/DeployExtSwap.s.sol --rpc-url "${{ steps.net.outputs.rpc }}" --broadcast --slow $VERIFY
          else
            echo "DRY RUN: nothing is sent."
            forge script script/Deploy.s.sol --rpc-url "${{ steps.net.outputs.rpc }}"
          fi

      - name: Check the wiring
        if: ${{ inputs.broadcast && inputs.verify_coin == '' }}
        run: forge script script/Verify.s.sol --rpc-url "${{ steps.net.outputs.rpc }}"

      - name: Save addresses
        if: ${{ inputs.broadcast && inputs.verify_coin == '' }}
        run: |
          cd ..
          git config user.name "arkhampad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/deployments/*.json
          git commit -m "Mainnet deployment: ${{ inputs.chain }}" || echo "Nothing to save."
          git pull --rebase
          git push

      - name: Verify one coin on the explorer (ArkhamPadCoin)
        if: ${{ inputs.verify_coin != '' && inputs.chain == 'base' }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          forge verify-contract "${{ inputs.verify_coin }}" src/PadCoin.sol:ArkhamPadCoin \
            --chain 8453 --rpc-url "${{ steps.net.outputs.rpc }}" --guess-constructor-args \
            --etherscan-api-key "$ETHERSCAN_API_KEY" --watch
