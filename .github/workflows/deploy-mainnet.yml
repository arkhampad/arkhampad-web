name: Deploy mainnet

# Runs only when started by hand. Always do a dry run first (broadcast off).
on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Network"
        required: true
        type: choice
        options:
          - base
          - robinhood
          - bnb
          - arc
      broadcast:
        description: "Really send the transactions (leave off for a dry run first)"
        required: true
        type: boolean
        default: false
      start_mc:
        description: "Launch market cap in dollars"
        required: true
        default: "2000"
      verify_coin:
        description: "Optional: address of one launched coin to verify on the explorer (leave empty when deploying)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

env:
  ADMIN: "0xfae9d1aBac2a9fd4Ab68af9fF346eA871E819158"
  TREASURY: "0xd9D46EB26c9D753135683b7736FC2be097e7B099"
  RELAYER: "0x736662A7230092D1e728954508318b145e5B1B1C"
  VAULT_DAILY_CAP: "500"
  MIN_LAUNCH_BUY: "5"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      # Pinned: the same Foundry version always builds byte-identical contracts,
      # so explorer verification files match on the first try.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Get libraries
        run: |
          mkdir -p lib
          git clone -q --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone -q --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone -q https://github.com/Uniswap/v4-periphery lib/v4-periphery
          cd lib/v4-periphery
          git -c advice.detachedHead=false checkout -q 9969eec44cfdf07e24b41de47f40276a58401976
          git submodule update -q --init --depth 1 lib/v4-core lib/permit2
          cd lib/v4-core && git submodule update -q --init --depth 1 lib/solmate

      - name: Pick network
        id: net
        run: |
          case "${{ inputs.chain }}" in
            base)      echo "rpc=${{ secrets.BASE_RPC }}" >> "$GITHUB_OUTPUT"; echo "id=8453" >> "$GITHUB_OUTPUT"; echo "freeverify=no" >> "$GITHUB_OUTPUT" ;;
            robinhood) echo "rpc=${{ secrets.ROBINHOOD_RPC }}" >> "$GITHUB_OUTPUT"; echo "id=4663" >> "$GITHUB_OUTPUT"; echo "freeverify=yes" >> "$GITHUB_OUTPUT" ;;
            bnb)       echo "rpc=${{ secrets.BNB_RPC }}" >> "$GITHUB_OUTPUT"; echo "id=56" >> "$GITHUB_OUTPUT"; echo "freeverify=no" >> "$GITHUB_OUTPUT" ;;
            arc)       echo "rpc=${{ secrets.ARC_RPC }}" >> "$GITHUB_OUTPUT"; echo "id=5042" >> "$GITHUB_OUTPUT"; echo "freeverify=yes" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        run: forge build

      - name: Tests (must pass before anything is sent)
        if: ${{ inputs.verify_coin == '' }}
        run: forge test --no-match-path "test/*Fork.t.sol"

      - name: Deploy
        if: ${{ inputs.verify_coin == '' }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_KEY }}
          START_MC: ${{ inputs.start_mc }}
        run: |
          if [ "${{ inputs.broadcast }}" = "true" ]; then
            forge script script/Deploy.s.sol --rpc-url "${{ steps.net.outputs.rpc }}" --broadcast --slow --non-interactive
            forge script script/DeployExtSwap.s.sol --rpc-url "${{ steps.net.outputs.rpc }}" --broadcast --slow --non-interactive
          else
            echo "DRY RUN: nothing is sent."
            forge script script/Deploy.s.sol --rpc-url "${{ steps.net.outputs.rpc }}"
          fi

      - name: Check the wiring
        if: ${{ inputs.broadcast && inputs.verify_coin == '' }}
        run: forge script script/Verify.s.sol --rpc-url "${{ steps.net.outputs.rpc }}"

      - name: Save addresses
        if: ${{ inputs.broadcast && inputs.verify_coin == '' }}
        run: |
          cd ..
          git config user.name "arkhampad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/deployments/*.json
          git commit -m "Mainnet deployment: ${{ inputs.chain }}" || echo "Nothing to save."
          git pull --rebase
          git push

      # Free explorer verification (Robinhood, Arc). Base and BNB are verified by hand.
      # A failure here never undoes the deploy: the addresses are already saved above.
      - name: Verify contracts on the explorer
        if: ${{ inputs.broadcast && inputs.verify_coin == '' && steps.net.outputs.freeverify == 'yes' }}
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          ID=${{ steps.net.outputs.id }}
          RPC="${{ steps.net.outputs.rpc }}"
          F=deployments/$ID.json
          V="--chain $ID --verifier etherscan --verifier-url https://api.etherscan.io/v2/api?chainid=$ID --etherscan-api-key $ETHERSCAN_API_KEY --watch"
          for pair in vault:src/PadFeeVault.sol:PadFeeVault poolBuilder:src/PadPoolBuilder.sol:PadPoolBuilder hub:src/PadHub.sol:PadHub promote:src/PadPromote.sol:PadPromote router:src/PadRouter.sol:PadRouter; do
            KEY=${pair%%:*}; SRC=${pair#*:}
            ADDR=$(jq -r ".$KEY" "$F")
            echo "== $KEY $ADDR"
            forge verify-contract "$ADDR" "$SRC" --rpc-url "$RPC" --guess-constructor-args $V || echo "!! $KEY not verified"
          done
          GUARD=$(jq -r .guard "$F"); PM=$(jq -r .poolManager "$F"); PB=$(jq -r .poolBuilder "$F")
          echo "== guard $GUARD"
          forge verify-contract "$GUARD" src/PadLaunchHook.sol:PadLaunchHook \
            --constructor-args $(cast abi-encode "c(address,address)" "$PM" "$PB") $V || echo "!! guard not verified"

      - name: Verify one coin on the explorer (ArkhamPadCoin)
        if: ${{ inputs.verify_coin != '' }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          ID=${{ steps.net.outputs.id }}
          forge verify-contract "${{ inputs.verify_coin }}" src/PadCoin.sol:ArkhamPadCoin \
            --chain $ID --rpc-url "${{ steps.net.outputs.rpc }}" --guess-constructor-args \
            --verifier etherscan --verifier-url "https://api.etherscan.io/v2/api?chainid=$ID" \
            --etherscan-api-key "$ETHERSCAN_API_KEY" --watch
