name: Contracts

on:
  workflow_dispatch:
  push:
    paths:
      - "contracts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      BASE_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC }}
      BASE_RPC: ${{ secrets.BASE_RPC }}
      ROBINHOOD_TESTNET_RPC: ${{ secrets.ROBINHOOD_TESTNET_RPC }}
      ROBINHOOD_RPC: ${{ secrets.ROBINHOOD_RPC }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Get libraries
        run: |
          mkdir -p lib
          git clone -q --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone -q --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone -q https://github.com/Uniswap/v4-periphery lib/v4-periphery
          cd lib/v4-periphery
          git -c advice.detachedHead=false checkout -q 9969eec44cfdf07e24b41de47f40276a58401976
          git submodule update -q --init --depth 1 lib/v4-core lib/permit2
          cd lib/v4-core && git submodule update -q --init --depth 1 lib/solmate

      - name: Build
        run: forge build --sizes

      - name: Unit and local Uniswap tests
        run: forge test -vv --no-match-path "test/PoolFork.t.sol"

      - name: Real-network tests (Base Sepolia, Base, Robinhood testnet, Robinhood mainnet)
        run: |
          for s in BaseSepoliaForkTest BaseMainnetForkTest RobinhoodTestnetForkTest RobinhoodMainnetForkTest; do
            echo "::group::$s"
            forge test -vv --match-contract "$s" || { sleep 10; forge test -vv --match-contract "$s"; }
            echo "::endgroup::"
          done
